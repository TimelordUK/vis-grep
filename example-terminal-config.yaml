# Example configuration showing terminal setup for different platforms

# Windows configuration
terminal:
  # PowerShell Core (pwsh) - recommended for Windows
  command: "pwsh"
  args: ["-NoExit", "-Command"]
  pager: "less"  # Requires less.exe in PATH (e.g., from Git for Windows)
  pager_args: []
  
  # Alternative: PowerShell with more (built-in Windows pager)
  # command: "pwsh"
  # args: ["-NoExit", "-Command"]
  # pager: "more"
  # pager_args: []
  
  # Alternative: Windows Terminal with CMD
  # command: "wt"
  # args: ["-d", ".", "cmd", "/k"]
  # pager: "more"
  # pager_args: []
  
  # Alternative: Windows Terminal with PowerShell
  # command: "wt"
  # args: ["-d", ".", "pwsh", "-NoExit", "-Command"]
  # pager: "Get-Content"
  # pager_args: ["-Wait", "|", "more"]

